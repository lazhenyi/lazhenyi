name: Update GitHub Readme Stats

# 注：stats 卡片需要用户级 token（用 GITHUB_TOKEN 会报 Resource not accessible），
# 已在 README 中改用 github-readme-stats 公开实例，这里只生成本地 top-langs 卡片。

on:
  schedule:
    - cron: "0 0 * * *" # 每天 00:00 UTC 跑一次
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  generate-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: soulteary/github-readme-stats-action@v1.0.0
        with:
          card: top-langs
          options: 'username=${{ github.repository_owner }}&layout=compact&langs_count=6'
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update stats" || exit 0
          git push
